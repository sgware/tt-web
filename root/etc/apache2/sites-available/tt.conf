ServerName localhost

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/tt/public_html
    ErrorLog ${APACHE_LOG_DIR}/tt_http_error.log
    CustomLog ${APACHE_LOG_DIR}/tt_http_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName localhost
    DocumentRoot /var/www/tt/public_html
    SSLEngine on
    SSLCertificateFile /etc/tt/certs/tt-public.pem
    SSLCertificateKeyFile /etc/tt/certs/tt-private.pem
    ErrorLog ${APACHE_LOG_DIR}/tt_https_error.log
    CustomLog ${APACHE_LOG_DIR}/tt_https_access.log combined
</VirtualHost>